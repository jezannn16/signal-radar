[project]
name = "signal-radar"
version = "0.1.0"
description = "RSS and GitHub monitoring with explainable rules"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
telegram = ["aiogram>=3.13,<4"]

[project.scripts]
signal-radar = "signal_radar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

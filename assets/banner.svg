<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="signal-title signal-desc">
  <title id="signal-title">Signal Radar</title>
  <desc id="signal-desc">A dark editorial radar display with feed cards and a focused signal ring for public RSS and GitHub release monitoring.</desc>
  <defs>
    <linearGradient id="signal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d2b"/>
      <stop offset="1" stop-color="#202b39"/>
    </linearGradient>
    <linearGradient id="signal-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffce75"/>
      <stop offset="1" stop-color="#ff8e72"/>
    </linearGradient>
    <pattern id="signal-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#eff5fc" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
